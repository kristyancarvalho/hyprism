  <path d="M1002 0h260L960 420H700Z" fill="url(#beam)"/>
  <rect x="1155" y="70" width="310" height="92" rx="28" fill="#E9E5DC" fill-opacity=".08"/>
  <rect x="1078" y="181" width="388" height="166" rx="38" fill="#E9E5DC" fill-opacity=".06" stroke="#E9E5DC" stroke-opacity=".08" stroke-width="2"/>
  <rect x="1120" y="217" width="132" height="94" rx="28" fill="#BED0D9" fill-opacity=".14"/>
  <rect x="1270" y="217" width="154" height="94" rx="28" fill="#C99C7B" fill-opacity=".14"/>
