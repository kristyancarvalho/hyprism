<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Hyprism</title>
  <desc id="desc">Hyprism project banner with a prism-shaped H and layered adaptive desktop surfaces.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D1B19"/>
      <stop offset=".56" stop-color="#282420"/>
      <stop offset="1" stop-color="#423125"/>
    </linearGradient>
    <linearGradient id="left" x1="56" y1="48" x2="104" y2="208" gradientUnits="userSpaceOnUse">
