$hyprism_background = rgb(091015)
$hyprism_surface = rgb(18232a)
$hyprism_surface_active = rgb(203640)
$hyprism_foreground = rgb(e0e8ee)
$hyprism_muted = rgb(87949e)
$hyprism_accent = rgb(3ba7d9)
$hyprism_secondary = rgb(8ebbd8)
$hyprism_error = rgb(e4777f)

general {
    hide_cursor = true
    screencopy_mode = 1
}

animations {
    enabled = false
}

background {
    monitor =
    path =
    color = $hyprism_background
    blur_passes = 3
    blur_size = 8
    brightness = 0.72
}

label {
    monitor =
    text = cmd[update:1000] date +'%H'
    color = $hyprism_accent
    font_family = Google Sans Flex
    font_size = 64
    position = 0, 132
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%M'
    color = $hyprism_secondary
    font_family = Google Sans Flex
    font_size = 64
    position = 0, 55
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%d/%m/%Y'
    color = $hyprism_muted
    font_family = Google Sans Flex
    font_size = 16
    position = 0, -6
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾
    color = $hyprism_accent
    font_family = Symbols Nerd Font Mono
    font_size = 14
    position = -60, -78
    halign = center
    valign = center
}

label {
    monitor =
    text = Bloqueado
    color = $hyprism_foreground
    font_family = Google Sans Flex
    font_size = 14
    position = 14, -78
    halign = center
    valign = center
    shadow_size = 2
    shadow_passes = 2
    shadow_color = $hyprism_background
}

input-field {
    monitor =
    size = 340, 50
    position = 0, -140
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 9
    outer_color = $hyprism_accent
    inner_color = $hyprism_surface
    font_color = $hyprism_foreground
    check_color = $hyprism_accent
    fail_color = $hyprism_error
    capslock_color = $hyprism_error
    font_family = Google Sans Flex
    placeholder_text =
    fail_text = Senha incorreta
    dots_center = true
    fade_on_empty = true
    fade_timeout = 0
}
