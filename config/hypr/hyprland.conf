# Hyprism is intentionally self-contained. ALT is the primary modifier for VM use.
source = ~/.cache/hyprism/theme/hyprland.conf

monitor = ,preferred,auto,1
$mainMod = ALT
$scripts = ~/.local/share/hyprism/scripts

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita:dark

input {
    kb_layout = br
    follow_mouse = 1
}

general {
    gaps_in = 5
    gaps_out = 14
    border_size = 2
    col.active_border = $hyprism_active_border
    col.inactive_border = $hyprism_inactive_border
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true
    bezier = hyprism,0.2,0.0,0.0,1.0
    animation = windows,1,5,hyprism,popin 85%
    animation = workspaces,1,4,hyprism,slide
    animation = fade,1,4,hyprism
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# Quickshell owns all visible shell UI. These only start backend processes.
exec-once = swww-daemon
exec-once = quickshell -p ~/.config/quickshell
exec-once = ~/.local/share/hyprism/scripts/system/action clipboard-watch
exec-once = ~/.local/share/hyprism/scripts/wallpaper restore
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Applications and morphological panels
bind = $mainMod, RETURN, exec, hyprism-launch terminal
bind = $mainMod, E, exec, hyprism-launch file-manager
bind = $mainMod, B, exec, hyprism-launch browser
bind = $mainMod, R, exec, qs ipc call app-launcher toggle
bind = $mainMod, K, exec, qs ipc call wallpaper-picker toggle
bind = $mainMod SHIFT, V, exec, qs ipc call clipboard toggle
bind = $mainMod SHIFT, N, exec, qs ipc call shell toggleNetwork
bind = $mainMod SHIFT, I, exec, qs ipc call shell togglePowerSaver
bind = $mainMod SHIFT, E, exec, ~/.local/share/hyprism/scripts/system/reload-shell
bind = $mainMod SHIFT, L, exec, qs ipc call power-menu toggle
bind = $mainMod, M, exec, qs ipc call power-menu toggle
bind = $mainMod, L, exec, hyprlock
bind = CTRL, PERIOD, exec, qs ipc call emoji-picker toggle

# Window and workspace management
bind = $mainMod, W, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, P, togglepseudo
bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d
bind = $mainMod CTRL, LEFT, exec, $scripts/system/move-or-scroll l
bind = $mainMod CTRL, RIGHT, exec, $scripts/system/move-or-scroll r
bind = $mainMod CTRL, UP, movewindow, u
bind = $mainMod CTRL, DOWN, movewindow, d
bind = $mainMod SUPER, RIGHT, resizeactive, 30 0
bind = $mainMod SUPER, LEFT, resizeactive, -30 0
bind = $mainMod SUPER, UP, resizeactive, 0 -30
bind = $mainMod SUPER, DOWN, resizeactive, 0 30
binde = $mainMod SUPER, RIGHT, resizeactive, 30 0
binde = $mainMod SUPER, LEFT, resizeactive, -30 0
binde = $mainMod SUPER, UP, resizeactive, 0 -30
binde = $mainMod SUPER, DOWN, resizeactive, 0 30
bind = $mainMod, EQUAL, layoutmsg, colresize +conf
bind = $mainMod, MINUS, layoutmsg, colresize -conf
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, U, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ALT is committed on release, never SUPER. Repeated Tab advances while held.
bind = $mainMod, TAB, exec, qs ipc call window-switcher forward
bind = $mainMod SHIFT, TAB, exec, qs ipc call window-switcher backward
bindr = $mainMod, ALT_L, exec, qs ipc call window-switcher commit
bindr = $mainMod, ALT_R, exec, qs ipc call window-switcher commit

# Audio, brightness, media, and OSD feedback
bind = $mainMod SHIFT, UP, exec, $scripts/system/action volume-up
bind = $mainMod SHIFT, DOWN, exec, $scripts/system/action volume-down
bind = $mainMod SHIFT, M, exec, $scripts/system/action volume-mute
bind = $mainMod SUPER, M, exec, $scripts/system/action mic-mute
bindel = , XF86AudioRaiseVolume, exec, $scripts/system/action volume-up
bindel = , XF86AudioLowerVolume, exec, $scripts/system/action volume-down
bindel = , XF86AudioMute, exec, $scripts/system/action volume-mute
bindel = , XF86AudioMicMute, exec, $scripts/system/action mic-mute
bindel = , XF86MonBrightnessUp, exec, $scripts/system/action brightness-up
bindel = , XF86MonBrightnessDown, exec, $scripts/system/action brightness-down
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Utilities
bind = $mainMod SUPER, K, exec, qs ipc call wallpaper random
bind = $mainMod SHIFT, S, exec, $scripts/system/action screenshot-area
bind = $mainMod SHIFT, F, exec, $scripts/system/action screenshot-monitor
bind = $mainMod CTRL, P, exec, $scripts/system/action color-picker
bind = $mainMod SHIFT, R, exec, $scripts/system/action record
bind = $mainMod CTRL, S, exec, $scripts/system/action night-mode toggle
bind = $mainMod CTRL, C, exec, chromium --app=https://chat.openai.com
bind = $mainMod CTRL, Y, exec, chromium --app=https://youtube.com
bind = $mainMod CTRL, X, exec, chromium --app=https://x.com
bind = $mainMod CTRL, R, exec, chromium --app=https://reddit.com

# 1..10 workspaces (0 maps to 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
