set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg={{colors.background.dark.hex}},fg={{colors.on_surface.dark.hex}}"

set -g status-left-length 40
set -g status-left "#[bg={{colors.primary.dark.hex}},fg={{colors.on_primary.dark.hex}},bold] 󰣇 #S #[bg={{colors.background.dark.hex}},fg={{colors.primary.dark.hex}},nobold]"

set -g status-right-length 90
set -g status-right "#[bg={{colors.background.dark.hex}},fg={{colors.on_surface_variant.dark.hex}}] 󰃭 %a %d %b #[fg={{colors.outline.dark.hex}}]#[fg={{colors.secondary.dark.hex}}] 󰍹 #H #[fg={{colors.outline.dark.hex}}]#[fg={{colors.primary.dark.hex}}]#[bg={{colors.primary.dark.hex}},fg={{colors.on_primary.dark.hex}},bold] 󰥔 %H:%M "

set -g window-status-format "#[bg={{colors.background.dark.hex}},fg={{colors.on_surface_variant.dark.hex}}] 󰖯 #I  #W "
set -g window-status-separator ""
set -g window-status-current-format "#[bg={{colors.primary_container.dark.hex}},fg={{colors.background.dark.hex}}]#[bg={{colors.primary_container.dark.hex}},fg={{colors.on_primary_container.dark.hex}},bold] 󰖯 #I  #W #[bg={{colors.background.dark.hex}},fg={{colors.primary_container.dark.hex}}]"
set -g window-status-bell-style "bg={{colors.error.dark.hex}},fg={{colors.on_error.dark.hex}},bold"

set -g pane-border-style "fg={{colors.outline.dark.hex}}"
set -g pane-active-border-style "fg={{colors.primary.dark.hex}}"
set -g pane-border-lines single
set -g display-panes-colour "{{colors.outline.dark.hex}}"
set -g display-panes-active-colour "{{colors.primary.dark.hex}}"

set -g message-style "bg={{colors.surface.dark.hex}},fg={{colors.on_surface.dark.hex}},bold"
set -g message-command-style "bg={{colors.surface_container_high.dark.hex}},fg={{colors.secondary.dark.hex}}"
set -g clock-mode-colour "{{colors.primary.dark.hex}}"
set -g clock-mode-style 24
set -g mode-style "bg={{colors.on_surface.dark.hex}},fg={{colors.background.dark.hex}}"
