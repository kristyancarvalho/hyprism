name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Hyprism. Remove secrets and personal information from logs and screenshots before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the issue clearly and concisely.
      placeholder: What went wrong, and where did it happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Include the Hyprism release or commit, Hyprland version, and Quickshell version.
      placeholder: |
        Hyprism: v0.1.0
        Hyprland: 0.x.x
        Quickshell: 0.x.x
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Linux distribution
      placeholder: Arch Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the output related to the issue. Remove credentials, tokens, network secrets, and personal data.
      render: shell
  - type: upload
    id: media
    attributes:
      label: Screenshots or video
      description: Add visual evidence when it helps explain the problem.
    validations:
      accept: ".png,.jpg,.jpeg,.webp,.gif,.mp4,.webm"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other information that may help diagnose the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I tested a reasonably current Hyprism release or commit where practical.
          required: true
